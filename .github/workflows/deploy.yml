name: Deploy site

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  id-token: write   # lets the job request an OIDC token
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the site
        working-directory: web
        env:
          VITE_API_BASE: ${{ vars.API_BASE }}
        run: |
          npm ci
          npm run build

      - name: Debug OIDC identity
        env:
          ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          echo "role name part: [${ROLE##*/}]"
          echo "ARN length (expect 54): ${#ROLE}"
          python3 - <<'PY'
          import os, json, base64, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req = urllib.request.Request(url, headers={"Authorization": "bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          tok = json.load(urllib.request.urlopen(req))["value"]
          p = tok.split(".")[1]
          p += "=" * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          for k in ("sub", "aud", "iss", "repository", "ref"):
              print(k, "=", c.get(k))
          PY

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Upload hashed assets (cached for a year)
        run: aws s3 sync web/dist/assets s3://${{ vars.SITE_BUCKET }}/assets --cache-control "public,max-age=31536000,immutable"

      - name: Upload the rest of the site
        run: aws s3 sync web/dist s3://${{ vars.SITE_BUCKET }}/ --delete --exclude "assets/*" --cache-control "public,max-age=300"

      - name: Clear the CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_ID }} --paths "/*"